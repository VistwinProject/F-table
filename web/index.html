<!doctype html>
<html lang="zh-TW" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Control</title>

    <!-- Anti-FOUC: apply saved theme before paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (_) {}
      })()
    </script>

    <!-- Latin/數字走系統字（見 style.css 的 --font-display）；只外掛 CJK 字體。
         ⚠ 展場離線時這條會失效，退到 PingFang TC / 微軟正黑體。 -->
    <link href="https://cdn.jsdelivr.net/npm/chiron-hei-hk@latest/css/ChironHeiHK.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
