    .kg-edge-label{fill:#8eb8cb;font-size:14px;letter-spacing:.08em;text-anchor:middle}
    .kg-node{position:absolute;transform:translate(-50%,-50%);width:72px;height:72px;border:2px solid #6ca9c8;border-radius:50%;background:radial-gradient(circle at 35% 30%,#74d8f2,#194760 62%,#102639);box-shadow:0 0 0 8px #68c8ec0c,0 0 23px #54bfea88,inset 0 0 15px #b1eeff66;display:grid;place-items:center;text-align:center;cursor:grab;user-select:none;animation:appear .65s backwards}

    .kg-node.is-tour{z-index:4;filter:brightness(1.25);box-shadow:0 0 0 15px #a9eeff20,0 0 43px #8ae5ff,inset 0 0 24px #ffffff88}

    .kg-node:before{content:"關";font-size:19px;font-weight:700;color:#e9faff}

    @keyframes breathe{50%{box-shadow:0 0 0 23px #a9e8ff0d,0 0 0 49px #b7e9ff06,0 0 55px #70d8ff,inset 0 0 45px #6acafd44}}
    .hub{animation:breathe 5s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.hub,.kg-node{animation:none}#kg-scene{transition:none}}

    .kg-node.asset:before{content:"資產";font-size:21px}

    .kg-node.project{border-color:#f4cf87;background:radial-gradient(circle at 35% 30%,#fbd39a,#9f6735 65%,#503b29)}

    .kg-node.document{border-color:#a5b4c0;background:radial-gradient(circle at 35% 30%,#bfced7,#566b78 65%,#2c3c48)}

    .kg-node-type{display:none}
    .kg-node-name{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:210px;margin-top:9px;font-size:18px;line-height:1.25;color:#d8edf7;text-shadow:0 2px 7px #001622;overflow-wrap:anywhere}
    .kg-node.asset .kg-node-name{font-size:25px;font-weight:600;color:#effffb}
    .kg-node.space .kg-node-name{font-size:14px;width:145px}
    .auto-qa{position:absolute;right:28px;bottom:28px;z-index:8;width:780px;pointer-events:none}
    .auto-qa[hidden]{display:none}
    .auto-qa-dialog{box-sizing:border-box;width:100%;padding:22px 26px;border:1px solid #8bd9ed;border-radius:22px;background:linear-gradient(145deg,#19364bee,#101d30f2);box-shadow:0 0 35px #62c6ed55,inset 0 1px #ffffff2a;animation:qa-enter .55s ease-out}
    @keyframes qa-enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .auto-qa-top{color:#7ed6eb;font-size:24px;letter-spacing:.1em}
    .auto-qa-source{display:block;margin-top:7px;color:#91adbd;font-size:20px;letter-spacing:.02em}
    .auto-qa-question{margin:18px 0 14px;font-size:50px;font-weight:600;line-height:1.25;color:#f0fbff}
    .auto-qa-answer{font-size:38px;line-height:1.42;color:#d1e7f2;white-space:pre-wrap}
    .auto-qa-answer:after{content:"";display:inline-block;width:9px;height:37px;margin-left:6px;background:#8ce6f6;vertical-align:-5px;animation:blink .8s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .auto-qa-foot{margin-top:16px;color:#81aabe;font-size:20px;letter-spacing:.03em}
    @media (prefers-reduced-motion:reduce){.auto-qa-dialog,.auto-qa-answer:after{animation:none}}

    #links path.active{opacity:.85;stroke-width:3}
    #links path.focus{opacity:1;stroke:#a6eafa;stroke-width:5;filter:drop-shadow(0 0 9px #64d5ff)}

    .hub-sub{font-size:14px;color:#b4d9e7;letter-spacing:.18em}

    .device.is-focus{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 32px #84dafaad,inset 0 0 26px #56c9f952,0 10px 24px #0008}
    .device.is-dim{opacity:.33}
    .device-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .device-name{font-size:23px;font-weight:600;white-space:nowrap}
    .device-dot{width:17px;height:17px;flex:none;border-radius:50%;border:2px solid #668fa6;background:#314559}
    .is-on .device-dot{border-color:#cbf7ff;background:#7be1ff;box-shadow:0 0 16px #72ddff}
    .device-meta{font-size:13px;color:#8eaec0;letter-spacing:.10em;margin-top:8px}
    .side{display:flex;flex-direction:column;gap:19px}
    .side-card{border:1px solid #46637b;border-radius:23px;background:linear-gradient(145deg,#1f3044d9,#111e30e8);box-shadow:inset 0 1px #ffffff11,0 16px 33px #0005;padding:26px 28px}

    .side-kicker{color:#73cfe9;letter-spacing:.18em;font-size:15px;font-weight:600}
    #panel-title{font-size:35px;line-height:1.2;letter-spacing:.05em;margin:18px 0 12px;font-weight:600}

    .relation-value{font-size:20px;line-height:1.45;color:#e7f6fc}

n- **專業清洗**：每年一次\n- **保養週期**：2 年\n- **檢修週期**：5 年\n- **使用年限**：15 年\n- **智慧連動**：與 12 合 1 感測器連動，可自動調溫\n\n---\n\n如果您想了解各台冷氣的耗電比較，建議：\n1. **確認是否有其他樓層或戶別的冷氣**也屬於您的管理範圍\n2. **查閱設備規格書**，取得各台冷氣的額定功率（kW）進行比較\n3. 若有安裝**智慧電錶或能源監控系統**，可從實際用電數據判斷\n\n如需進一步協助，歡迎告知！","冷氣下一次維養是什麼時候，要維養什麼項目？":"我來同時查詢這台冷氣的維養計畫與相關資訊。已取得設備資訊與歷史紀錄，現在進一步查詢維養動作明細與維養建議。以下是 **知行案 3F-B 主臥冷氣（AST-AC-IDU-03F-B-001）** 的完整維養資訊：\n\n---\n\n## 🕐 下次維養時間\n\n根據歷史紀錄與維養週期推算：\n\n| 項目 | 資訊 |\n|------|------|\n| 上次維養日期 | **2026-03-10** |\n| 過去平均維養間隔 | 約 **7 個月**（207 天） |\n| **預估下次維養時間** | **2026 年 10 月前後** |\n\n> ⚠️ 目前氣象資料與住戶使用狀態尚未串接，若夏季使用頻繁，建議**提前確認**是否需要提早安排。\n\n---\n\n## 🔧 下次維養建議項目\n\n參考上次（2026-03-10）的維養內容，下次應執行以下項目：\n\n| # | 類型 | 維養項目 | 說明 |\n|---|------|----------|------|\n| 1 | 🔄 維養（M） | **濾網清洗 / 更換評估** | 拆下濾網清洗積垢，視髒污程度決定是否更換（年費約 $3,000） |\n| 2 | 🔄 維養（M） | **出風口清潔 & 排水管疏通** | 高壓清洗排水管，確認排水暢通，防止漏水 |\n| 3 | ✅ 檢查（C） | **冷媒壓力檢查** | 確認壓力值在正常範圍內，排除冷媒洩漏風險 |\n\n---\n\n## 📋 設備基本資訊\n\n- **設備名稱**：冷氣（主臥）\n- **Asset ID**：`AST-AC-IDU-03F-B-001`\n- **安裝位置**：空間 `A-R-03F-B-02`（主臥）\n- **所屬系統**：空調-冷暖氣（SYS-MEP-HVAC-AC）\n- **廠商建議保養週期**：每 2 年\n- **設備使用年限**：15 年\n\n---\n\n## 📌 歷史紀錄摘要\n\n| 日期 | 類型 | 事由 | 結果 | 費用 |\n|------|------|------|------|------|\n| 2025-08-15 | 報修 | 出風口異常噪音（風扇葉片鬆動） | 完成 | $2,500 |\n| 2026-03-10 | 定期維養 | 半年例行保養 | 合格 | $3,500 |\n\n如需安排維養，建議聯繫上次執行廠商**瀚頓**，並在 2026 年 10 月前完成排程。"},"erv":{"新風機會很耗電嗎？":"我來同時查詢這台新風機的設備資訊以及相關的耗電知識。Wiki 沒有直接的耗電文章，讓我進一步搜尋新風機耗電相關的文件資料。已取得足夠資訊，以下為您整理完整說明。\n\n---\n\n## 知行案 3F-B 戶新風機（AST-FA-FAU-03F-B-001）耗電分析\n\n### 📋 設備基本資訊\n\n| 項目 | 內容 |\n|------|------|\n| **Asset ID** | AST-FA-FAU-03F-B-001 |\n| **設備名稱** | 新風機（空調-全熱交換） |\n| **安裝位置** | 知行案 3F B戶（空間 A-R-03F-B-01） |\n| **所屬系統** | SYS-MEP-HVAC-ERV（全熱交換通風系統） |\n\n---\n\n### ⚡ 耗電量低嗎？\n\n根據系統資料中的全熱交換機規格文件，新風機（全熱交換器）的**輸入功率相當低**，以台達全熱交換機為例：\n\n| 型號 | 風量段 | 輸入功率（Watt） |\n|------|--------|----------------|\n| VEB150AT3 | 高速 | **40W** |\n| VEB150AT3 | 中速 | **27W** |\n| VEB150AT3 | 低速 | **17W** |\n| VEB250AT3 | 高速 | **98W** |\n| VEB350AT3 | 高速 | **168W** |\n\n> 以住宅常用的 150 型為例，**最高僅 40W**，相當於一顆傳統燈泡的用電量，長時間運轉一天也僅約 0.96 度電，**耗電量極低**。\n\n[SOURCE: 台達全熱交換機 SPEC DELTA-VTN_VEB150_250_350AT3_UM_TC_20200519.pdf]\n\n---\n\n### 🤖 智慧連動省電設計\n\n知行案 3F-B 戶的新風機還具備智慧節能機制：\n\n- **與 12 合一感測器（AST-IEQ-SEN-03F-B-001）連動**\n- 當室內 **CO₂ 或 PM2.5 超標**時，才自動加大換氣風量\n- 平時維持低速運轉，**按需換氣**，避免不必要的耗電\n\n---\n\n### 💡 總結\n\n> 新風機（全熱交換器）**不耗電**，是住宅設備中用電量最小的機電設備之一。加上知行案採用智慧感測器連動控制，只在空氣品質需要時才提升風量，整體能耗表現相當優異，不需擔心電費問題。\n\n如需進一步了解這台新風機的**維養計畫**或**濾網更換週期**，歡迎繼續詢問！","新風機什麼時候需要保養？":"我來同時查詢這台新風機的設備資訊和維養建議。以下是 **知行案 3F-B 戶新風機（AST-FA-FAU-03F-B-001）** 的完整保養資訊：\n\n---\n\n## 🌬️ 新風機保養時程總覽\n\n| 項目 | 內容 |\n|------|------|\n| **設備位置** | 3F B戶 — 玄關+客廳+廚房（空間 A-R-03F-B-01） |\n| **所屬系統** | 空調-新風系統（SYS-MEP-HVAC-FA） |\n| **上次維養** | 2026-01-10（距今約 5 個月，結果：合格） |\n| **設備使用年限** | 15 年 |\n\n---\n\n## 📅 建議保養時程\n\n### 1️⃣ 濾網更換（每 6～12 個月）⚠️ 優先安排\n- **建議時間：2027-01 前**\n- 需更換：初效濾網、活性碳濾網、HEPA 濾網（三合一）\n- 費用約：**濾網 3,000 元/組 + 工資 3,500 元**，合計約 **6,500 元/年**\n- 上次維養（2026-01-10）已更換初效與活性碳濾網，建議屆滿 1 年前再次評估濾網狀況\n\n### 2️⃣ 例行保養（每 2 年一次）\n- **下次預計：2028-01**\n- 依廠商建議週期，每 2 年進行一次全面例行保養\n\n### 3️⃣ 專業檢修（每 5 年一次）\n- 每 5 年安排一次深度檢修\n\n---\n\n## 💡 智慧連動提醒\n\n此台新風機與 **12 合 1 感測器**連動，當室內 **CO₂ 或 PM2.5 超標**時會自動加大換氣量。若感測器頻繁觸發，代表濾網可能已達使用極限，建議**提前安排濾網檢查**。\n\n---\n\n## ⚠️ 注意事項\n\n目前系統尚有兩項資料待接入：\n- **氣象 API**（外部空氣品質）\n- **Well FM 使用狀態**（家中實際使用頻率）\n\n這兩項資料接入後，可進一步精準調整保養週期。若台北近期空氣品質較差或使用頻率偏高，建議**提前至 2026 年底前**安排濾網檢查。\n\n---\n\n如需安排保養，可進一步協助聯繫廠商或建立維養工單！"},"bath-heater":{"洗完澡後，浴室多久會恢復乾燥？":"我來同時查詢這台設備的資訊和相關維養建議。我已查到這台設備的完整資訊，但關於「洗澡後浴室多久乾燥」的具體時間，資料庫中並無記載。讓我再進一步搜尋設備規格說明。找到相關文件了，讓我再深入搜尋乾燥時間的具體說明。根據所有查詢結果，以下是完整說明：\n\n---\n\n## 🚿 知行案 3F-B 主臥浴室暖風機（AST-EA-BHF-03F-B-001）\n\n### 📍 設備基本資訊\n| 項目 | 內容 |\n|------|------|\n| **設備名稱** | 主臥浴室暖風機 |\n| **Asset ID** | AST-EA-BHF-03F-B-001 |\n| **所在空間** | A-R-03F-B-03（主臥浴室） |\n| **所屬系統** | SYS-MEP-HVAC-EA（空調-排風系統） |\n\n---\n\n### ❓ 洗澡後浴室多久恢復乾燥？\n\n很抱歉，目前資料庫中**並未記載具體的乾燥恢復時間**（如「XX 分鐘」），設備規格頁面與維養文件均未提供此數值。\n\n不過，根據內部知識文件的說明，可以提供以下背景資訊：\n\n> 浴室暖風乾燥機集**暖風、乾燥、換氣**三大功能於一體。若**未開啟乾燥功能**，洗浴後水蒸氣容易積聚，導致浴室長時間處於潮濕狀態，並可能引發霉菌滋生。\n\n[SOURCE: 240106-健康-曾祿-暖風機安裝注意事項(可公開)修改後.docx]\n\n具體的乾燥時間會受到以下因素影響，但這些數值需參照設備廠商規格書：\n- 浴室坪數大小\n- 當下室內溫濕度\n- 暖風機的風量與加熱功率\n- 是否同時搭配換氣排風\n\n---\n\n### 💡 建議\n若您需要確切的乾燥時間，建議：\n1. **查閱設備廠商規格書**，文件中有提供維養參考連結：[浴室暖風機維養](https://docs.google.com/document/d/1gmCCvSaBpKZ7z_qS5CScOOXjdqMWiqQl/edit)\n2. 或直接聯繫家電廠商，由專人查詢該型號的詳細性能規格。\n\n如需進一步查詢此設備的**維養紀錄**或**保養排程**，也歡迎告知！","浴室暖風機下一次維養是什麼時候？":"我來同時查詢設備的維養計畫與相關紀錄。找到維養紀錄了，讓我再查詢維養計畫的詳細週期資訊。以下是 **知行案 3F-B 戶主臥浴室暖風機（AST-EA-BHF-03F-B-001）** 的維養資訊彙整：\n\n---\n\n## 🛁 設備基本資訊\n\n| 項目 | 內容 |\n|------|------|\n| **設備名稱** | 主臥浴室暖風機 |\n| **Asset ID** | AST-EA-BHF-03F-B-001 |\n| **安裝位置** | A-R-03F-B-03（3F-B 主臥浴室） |\n| **所屬系統** | SYS-MEP-HVAC-EA（空調-排風） |\n\n---\n\n## 🔧 上次維養紀錄\n\n- **日期：** 2025-12-05\n- **結果：** ✅ 合格\n- **作業內容：**\n  - 風扇模組清潔，檢查葉片磨損狀況，運轉正常\n  - 排風管道檢查，確認管道暢通無阻塞；加熱元件檢查，升溫正常\n\n---\n\n## 📅 下次維養建議\n\n| 項目 | 內容 |\n|------|------|\n| **廠商建議週期** | 每 **2 年** 一次例行保養 |\n| **預計下次維養** | **2027 年 12 月** |\n| **設備設計壽命** | 15 年（更換費用約 NT$12,000） |\n| **目前狀態** | 🟢 尚在週期內，無需立即處理 |\n\n---\n\n## ℹ️ 補充說明\n\n目前有兩項資料尚待串接，待接入後可更精準評估維養需求：\n- **氣象 API**（weather）：尚未接入，無法評估環境條件影響\n- **Well FM 使用狀態**（usage）：串接中，無法掌握實際使用頻率\n\n建議待上述資料接入後，重新評估是否需調整保養頻率或提前執行。"},"sensor":{"梅雨季節到了，最近空氣品質真的好嗎？":"我來同時查詢這個感測器的相關資訊和維養紀錄！再查詢一下這台感測器的詳細維養動作與維養建議！以下是 **知行案 3F-B 戶 12合1感測器（AST-IEQ-SEN-03F-B-001）** 的完整現況報告：\n\n---\n\n## 📍 設備基本資訊\n\n| 項目 | 內容 |\n|------|------|\n| **Asset ID** | AST-IEQ-SEN-03F-B-001 |\n| **安裝位置** | A-R-03F-B-01（玄關 + 客廳 + 廚房） |\n| **所屬系統** | SYS-MEP-HLT-IEQ（室內環境品質監控） |\n| **設計壽命** | 10 年 |\n\n---\n\n## 🌡️ 最新感測數據（梅雨季節即時狀況）\n\n| 指標 | 最新讀值 | 時間 | 狀態 |\n|------|---------|------|------|\n| **CO₂ 濃度** | 761 ppm | 2026-06-21 | ✅ 正常（\u003c 1000 ppm） |\n| **相對濕度** | 60 % | 2026-06-21 | ⚠️ 偏高，梅雨季需留意 |\n| **PM2.5** | 4.5 μg/m³ | 2026-06-21 | ✅ 優良 |\n| **溫度** | 25.2 °C | 2026-06-21 | ✅ 舒適 |\n\n> 📌 **3天前（6/18）** 的數據顯示 PM2.5 曾飆升至 **16.2 μg/m³**、濕度 57%、溫度 28°C，推測為梅雨間歇晴天、室外空氣擾動所致，目前已回落至正常水準。\n\n---\n\n## 🔧 維養紀錄\n\n**最近一次維養：2025-11-20（距今約 7 個月）**\n\n- **執行廠商**：瀚頓\n-         for (let otherIndex=0;otherIndex<movingNodes.length;otherIndex++) {
          if (index === otherIndex) continue;

          const distanceY = node.y - other.y;

      return sentenceEnd >= 45 ? shortened.slice(0,sentenceEnd + 1) : `${shortened.trimEnd()}…`;
    }

    function closeAutoQa(restartTour = false) {
      clearTimeout(qaThinkTimer);
      clearInterval(qaTypingTimer);
      clearTimeout(qaCloseTimer);
      qaVisible = false;
      autoQa.hidden = true;
      if (restartTour && tourOrder.length) {
        tourIndex = (tourIndex + 1) % tourOrder.length;
        showTourStep();
      }
    }

    function showAutoQa() {
      const device = byId[currentId];
      const entries = Object.entries(ownerCache?.qa?.[device.cacheKey] || {});
      if (!entries.length) {tourIndex = 0;showTourStep();return;}
      const nextIndex = qaAlternation.get(device.id) || 0;
      qaAlternation.set(device.id,(nextIndex + 1) % entries.length);
      const [question,answer] = entries[nextIndex];
      qaVisible = true;
      autoQaQuestion.textContent = question;
      autoQaAnswer.textContent = '正在整理關聯資料…';
      autoQa.hidden = false;
      setText('story-label','AI 知識問答');
      setText('story-text',`${device.name} · 原始示範回答`);
      qaThinkTimer = setTimeout(() => {
        const excerpt = answerExcerpt(answer);
        if (reduceMotion) autoQaAnswer.textContent = excerpt;
        else {
          autoQaAnswer.textContent = '';
          let position = 0;
          qaTypingTimer = setInterval(() => {
            position = Math.min(position + 6,excerpt.length);
            autoQaAnswer.textContent = excerpt.slice(0,position);
            if (position === excerpt.length) clearInterval(qaTypingTimer);
          },32);
        }
      },650);
      qaCloseTimer = setTimeout(() => closeAutoQa(true),13500);
    }

    let panStart = null;
    kgScene.addEventListener('wheel',event => {
      event.preventDefault();
      manualHoldUntil = Date.now() + 12000;
      graphZoom = Math.max(0.75,Math.min(1.6,graphZoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      updateGraphTransform();
    },{passive:false});
    kgScene.addEventListener('pointerdown',event => {
      if (event.target.closest('.kg-node')) return;
      manualHoldUntil = Date.now() + 12000;
      panStart = {x:event.clientX,y:event.clientY,panX:graphPan.x,panY:graphPan.y};
      kgScene.setPointerCapture(event.pointerId);
    });
    kgScene.addEventListener('pointermove',event => {
      if (!panStart) return;
      manualHoldUntil = Date.now() + 12000;
      const bounds = graph.getBoundingClientRect();
      graphPan.x = panStart.panX + (event.clientX - panStart.x) * 1812 / bounds.width;
      graphPan.y = panStart.panY + (event.clientY - panStart.y) * 820 / bounds.height;
      updateGraphTransform();
    });
    const stopPan = () => {panStart = null;};
    kgScene.addEventListener('pointerup',stopPan);
    kgScene.addEventListener('pointercancel',stopPan);
    kgScene.addEventListener('dblclick',() => {
      manualHoldUntil = Date.now() + 12000;
      graphZoom = 1;graphPan = {x:0,y:0};updateGraphTransform();
    });

    function renderKnowledgeGraph(device) {
      const nextKey = device?.cacheKey || null;
      graph.classList.toggle('focus-mode',!!nextKey && !!ownerCache);
      if (nextKey === renderedGraphKey) return;
      renderedGraphKey = nextKey;
      cancelAnimationFrame(graphFrame);
      graphFrame = 0;
      movingNodes = [];
      movingEdges = [];
      tourOrder = [];
      tourIndex = 0;
      tourStepsSinceQa = 2;
      manualHoldUntil = 0;
      kgNodes.replaceChildren();
      kgLinks.replaceChildren();
      graphZoom = 1;
      graphPan = {x:0,y:0};
      updateGraphTransform();
      if (!device || !ownerCache) return;
      const cached = ownerCache.kg?.[device.cacheKey];
      if (!cached) return;
      const nodes = cached.nodes.filter(node => node.type !== 'Space' || node.id.includes('03F-B'));
      const positions = graphPositions(nodes);
      const movingById = new Map();
      for (const [index,node] of nodes.entries()) {
        const position = positions.get(node.id);
        if (!position) continue;
        const element = document.createElement('div');
        element.className = `kg-node ${String(node.type || 'concept').toLowerCase()}`;
        element.title = node.name;
        element.style.animationDelay = `${Math.min(index * 55,400)}ms`;
        const type = document.createElement('div');type.className = 'kg-node-type';type.textContent = {Asset:'資產',System:'系統',Space:'空間',Project:'建案',Document:'文件'}[node.type] || '關聯';
        const name = document.createElement('div');name.className = 'kg-node-name';name.textContent = graphLabel(node,device);
        element.append(type,name);
        kgNodes.append(element);
        const moving = {id:node.id,type:node.type,name:graphLabel(node,device),element,anchorX:position.x,anchorY:position.y,x:reduceMotion ? position.x : 906 + (position.x - 906) * 0.66,y:reduceMotion ? position.y : 410 + (position.y - 410) * 0.66,vx:0,vy:0,phase:index * 1.7,dragged:false};
        movingNodes.push(moving);
        movingById.set(node.id,moving);
        element.addEventListener('pointerdown',event => {
          event.stopPropagation();
          manualHoldUntil = Date.now() + 12000;
          moving.dragged = true;
          moving.vx = 0;moving.vy = 0;
          element.setPointerCapture(event.pointerId);
        });
        element.addEventListener('pointermove',event => {
          if (!moving.dragged) return;
          manualHoldUntil = Date.now() + 12000;
          const point = graphPoint(event);
          moving.x = Math.max(140,Math.min(1670,point.x));
          moving.y = Math.max(110,Math.min(720,point.y));
          moving.anchorX = moving.x;
          moving.anchorY = moving.y;
          updateGraphGeometry();
        });
        const release = () => {moving.dragged = false;};
        element.addEventListener('pointerup',release);
        element.addEventListener('pointercancel',release);
      }
      for (const edge of cached.edges) {
        const source = movingById.get(edge.source);
        const target = movingById.get(edge.target);
        if (!source || !target) continue;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('class','kg-edge');
        kgLinks.append(line);
        let label = null;
        if (edge.source === device.asset && edge.relation !== '屬於專案' && edge.relation !== '關聯') {
          label = document.createElementNS('http://www.w3.org/2000/svg','text');
          label.setAttribute('class','kg-edge-label');
          label.textContent = edge.relation;
          kgLinks.append(label);
        }
        movingEdges.push({source,target,line,label});
      }
      updateGraphGeometry();
      const typeOrder = {Asset:0,System:1,Space:2,Project:3,Document:4,concept:5};
      tourOrder = [...movingNodes].sort((first,second) => (typeOrder[first.type] ?? 5) - (typeOrder[second.type] ?? 5));
      showTourStep();
      if (!reduceMotion) graphFrame = requestAnimationFrame(animateGraph);
    }

    function showSource(title,content) {
      document.getElementById('source-title').textContent = title;
      document.getElementById('source-body').textContent = content;
      sourceModal.hidden = false;
    }

    function render() {
      const selected = byId[currentId] || devices[0];
      const active = activeIds();
      renderKnowledgeGraph(selected);
      setText('count',String(cycleIndex + 1).padStart(2,'0'));
      document.querySelectorAll('#preview-buttons button').forEach(button => button.setAttribute('aria-pressed',String(active.includes(button.dataset.id))));
    }

    function prioritize(id) {
      const index = devices.findIndex(device => device.id === id);
      if (index < 0) return;
      closeAutoQa();
      const changed = currentId !== id;
      tourStepsSinceQa = 2;
      cycleIndex = index;
      currentId = id;
      render();
      if (!changed && tourOrder.length) {tourIndex = 0;showTourStep();}
    }

    let renderedRevision=0,receivedSnapshot=false,graphSession=false;
    function reportGraph(){if(socket?.readyState===1&&receivedSnapshot)socket.send(JSON.stringify({type:'f-render',revision:renderedRevision,active:activeIds(),session:graphSession,muted:true,visible:!document.hidden,output:{nodes:document.querySelectorAll('.kg-node').length,selected:currentId}}));}
    setInterval(reportGraph,2000);
    function receive(event) {
      if (!event || typeof event !== 'object') return;
      if(Number.isInteger(event.revision))renderedRevision=event.revision;
      if (event.type === 'snapshot' && Array.isArray(event.slots)) {
        receivedSnapshot=true;graphSession=!!event.session;slots.clear();
        for (const entry of event.slots) if (Number.isInteger(entry.slot_index) && entry.slot_index >= 1 && entry.slot_index <= 9) slots.set(entry.slot_index,entry);
        const lastActive = activeIds().at(-1);
        if (lastActive) prioritize(lastActive);
      } else if (event.type === 'tag-present' && Number.isInteger(event.slot_index)) {
        slots.set(event.slot_index,{known:event.known,data:event.data});
        if (event.known !== false && byId[event.data?.id]) prioritize(event.data.id);
      } else if (event.type === 'tag-remove' && Number.isInteger(event.slot_index)) {
        slots.delete(event.slot_index);
      } else if (event.type === 'reader-disconnected' && Number.isInteger(event.slot_index)) {
        slots.delete(event.slot_index);
      } else if (event.type === 'session-start') {
        graphSession=true;
      } else if (event.type === 'session-end') {
        graphSession=false;
        slots.clear();
      } else {reportGraph();return;}
      render();
      if(socket?.readyState===1)setMode(activeIds().length?'NFC 即時連線':'等待感應 · 保留圖譜',true);
      reportGraph();
    }

    function setMode(label,connected) {
      setText('mode-text',label);
      elements['mode-pill'].classList.toggle('live',connected);
    }

    function connect() {
      if (!requestedSocket) return;
      try {
        const address = new URL(requestedSocket);
        if (!['ws:','wss:'].includes(address.protocol)) throw new Error('Invalid WebSocket URL');
        address.searchParams.set('role','graph');
        socket = new WebSocket(address);
        socket.addEventListener('open',() => setMode('NFC 即時連線',true));
        socket.addEventListener('message',message => {
          try { receive(JSON.parse(message.data)); } catch {}
        });
        socket.addEventListener('close',() => {
          receivedSnapshot=false;setMode('NFC 連線中斷',false);
          slots.clear();render();
          retryTimer = setTimeout(connect,2500);
        });
        socket.addEventListener('error',() => socket.close());
      } catch { setMode('NFC 位址無效',false); }
    }

    previewButtons.addEventListener('click',event => {
      const button = event.target.closest('button[data-id]');
      if (!button) return;
      const index = devices.findIndex(device => device.id === button.dataset.id) + 1;
      if (slots.has(index)) receive({type:'tag-remove',slot_index:index});
      else receive({type:'tag-present',slot_index:index,known:true,data:{id:button.dataset.id}});
    });
    document.getElementById('clear-button').addEventListener('click',() => receive({type:'session-end'}));
    document.getElementById('preview-toggle').addEventListener('click',() => preview.classList.toggle('collapsed'));
    document.getElementById('source-qa-button').addEventListener('click',() => {
      const device = byId[currentId];
      if (!device || !ownerCache) return;
      const answers = Object.entries(ownerCache.qa?.[device.cacheKey] || {}).map(([question,answer]) => `${question}\n\n${answer}`).join('\n\n──────────\n\n');
      showSource(`${device.name} · 業主原始問答`,answers);
    });
    document.getElementById('source-graph-button').addEventListener('click',() => {
      if (!ownerCache) return;
      const nodes = ownerCache.brain.nodes.map(node => `${node.type} · ${node.name}`).join('\n');
      const edges = ownerCache.brain.edges.map(edge => `${edge.source} —${edge.relation}→ ${edge.target}`).join('\n');
      showSource('業主原始圖譜 · 32 節點／65 關係',`節點\n${nodes}\n\n關係\n${edges}`);
    });
    document.getElementById('source-close').addEventListener('click',() => {sourceModal.hidden = true;});
    sourceModal.addEventListener('click',event => {if (event.target === sourceModal) sourceModal.hidden = true;});
    addEventListener('keydown',event => {if (event.key === 'Escape') sourceModal.hidden = true;});
    if (requestedSocket) { preview.hidden = true;setMode('等待 NFC 連線',false);connect(); }
    setInterval(advanceTour,250);
    render();
    if(new URLSearchParams(location.search).has('mute')){const badge=document.createElement('div');badge.textContent='F 本機驗證 · 靜音（無音訊）';badge.style.cssText='position:fixed;top:4px;left:4px;color:white;background:#234;z-index:9999;font:12px sans-serif;padding:5px';document.body.append(badge);}
  </script>
</body>
</html>
